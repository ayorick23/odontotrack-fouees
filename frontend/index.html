<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La app tiene su propio modo oscuro: que extensiones como Dark Reader no la repinten. -->
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/png" href="/logo-uees.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tipografía Satoshi (ITF Free Font License) servida por la API oficial
         de Fontshare: el repo es público y la licencia no permite redistribuir
         los archivos de la fuente dentro de él. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
    />
    <title>FOUEES</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fouees-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
